[pytest]
minversion = 8.0
testpaths = tests/test_api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --strict-markers --color=yes --tb=short --reruns 1 --reruns-delay 2

markers =
    smoke: 基础冒烟测试
    auth: 认证相关测试
    knowledge: 知识点相关测试
    ai: AI 接口相关测试
    graph: 图谱相关测试
    audio: 音频相关测试